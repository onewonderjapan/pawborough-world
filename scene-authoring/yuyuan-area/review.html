<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Pawborough 补修对照</title><style>body{max-width:1400px;margin:40px auto;padding:0 24px;background:#f4eee2;color:#362b20;font:17px/1.7 system-ui}h1{font-size:34px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:0}img{width:100%;border-radius:6px}section{margin:42px 0}a{color:#684b27}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style><h1>Pawborough · 审查补修</h1><p>保留原始建筑轮廓，恢复地图里的广场和楼下通道。5 条商业路线完成 3 米扫掠检查；最终 GLB 4,989 条射线无阻挡、无缺铺面。</p><p>以下为实际 GLB 重导入后的同机位离线对照。街道前后使用相同检查补光；并非游戏照明或浏览器截图。</p><p><a href="/">打开整区 3D 预览</a> · 需要支持 WebGL 的浏览器。豆类修件独立交付，整区仍使用原先选定的桌面合集。</p><section><h2>豫园老街楼下通道</h2><div class="pair"><figure><figcaption>补修前</figcaption><img src="review-images/old-street-before.png"></figure><figure><figcaption>补修后</figcaption><img src="review-images/old-street-after.png"></figure></div></section><section><h2>九曲桥广场铺面</h2><div class="pair"><figure><figcaption>补修前</figcaption><img src="review-images/jiuqu-square-before.png"></figure><figure><figcaption>补修后</figcaption><img src="review-images/jiuqu-square-after.png"></figure></div></section><section><h2>五香豆堆积与标签</h2><div class="pair"><figure><figcaption>补修前</figcaption><img src="review-images/bean-jar-before.png"></figure><figure><figcaption>补修后</figcaption><img src="review-images/bean-jar-after.png"></figure></div></section><section><h2>豆皮纹理与清晰度</h2><div class="pair"><figure><figcaption>补修前</figcaption><img src="review-images/bean-single-before.png"></figure><figure><figcaption>补修后</figcaption><img src="review-images/bean-single-after.png"></figure></div></section></html>
